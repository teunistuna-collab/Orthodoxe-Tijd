    <!-- Intro op mobiel: direct zichtbaar zolang de app laadt (src/main.tsx laat het wegvloeien). Inline, zodat het er staat vóór CSS en JS. -->
    <style>
      #intro{display:none}
      @media (max-width:767.98px){
        html{background:#1b0d09}
        #intro{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;
          background:radial-gradient(ellipse 70% 45% at 50% 44%,rgba(224,185,90,.16),transparent 70%),#1b0d09;color:#f4e6c8;transition:opacity .5s cubic-bezier(.22,1,.36,1)}
        #intro.is-weg{opacity:0;pointer-events:none}
        #intro img{width:96px;height:auto;filter:drop-shadow(0 0 18px rgba(224,185,90,.35));animation:intro-gloed 3.2s ease-in-out infinite}
        #intro .intro-naam{margin:0;font-family:"Cinzel","Trajan Pro",Georgia,serif;font-size:22px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:#e0b95a}
        #intro .intro-lijn{width:64px;height:1px;background:linear-gradient(90deg,transparent,#c49332,transparent)}
        #intro .intro-tekst{margin:0;font-family:"EB Garamond","Cormorant Garamond",Georgia,serif;font-size:18px;font-style:italic;color:rgba(244,230,200,.78)}
        @keyframes intro-gloed{0%,100%{filter:drop-shadow(0 0 14px rgba(224,185,90,.25))}50%{filter:drop-shadow(0 0 26px rgba(224,185,90,.5))}}
        @media (prefers-reduced-motion:reduce){#intro{transition:none}#intro img{animation:none}}
      }
    </style>
    <div id="intro" role="status" aria-label="Orthodoxe Tijd wordt geladen">

      <p class="intro-naam">Orthodoxe Tijd</p>
      <span class="intro-lijn" aria-hidden="true"></span>
      <p class="intro-tekst">Gebed door dag en jaar</p>
    </div>
