<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Gouden hoekversiering (linksboven), symmetrisch langs de diagonaal. De andere hoeken spiegelen via CSS. -->
  <g fill="none" stroke="#b88628" stroke-linecap="round" stroke-linejoin="round">
    <!-- arm langs de bovenrand en langs de linkerrand -->
    <path stroke-width="1.3" d="M11 11C15 5.6 21 3.8 29 3.8S42 3.6 47 3.6"/>
    <path stroke-width="1.3" d="M11 11C5.6 15 3.8 21 3.8 29S3.6 42 3.6 47"/>
    <!-- krul onder de bovenarm en naast de linkerarm -->
    <path stroke-width="1.2" d="M23 4.3c7.5.9 12 4 11.6 7.6-.3 2.7-3.3 3.3-4.3 1.3-.7-1.4.5-2.7 1.8-2.2"/>
    <path stroke-width="1.2" d="M4.3 23c.9 7.5 4 12 7.6 11.6 2.7-.3 3.3-3.3 1.3-4.3-1.4-.7-2.7.5-2.2 1.8"/>
    <!-- zijblaadjes van de knop -->
    <path stroke-width="1.1" d="M12 12c-2.8 1-5.3.6-7-1.2M12 12c1-2.8.6-5.3-1.2-7"/>
  </g>
  <g fill="#b88628">
    <!-- acanthusblaadjes langs de armen -->
    <path d="M14.5 8.2c3-2.5 7.2-2.8 9.7-1.2-3 1.8-6.4 2.3-9.7 1.2z"/>
    <path d="M8.2 14.5c-2.5 3-2.8 7.2-1.2 9.7 1.8-3 2.3-6.4 1.2-9.7z"/>
    <!-- slanke knop die de hoek in wijst -->
    <path d="M12.6 12.6C8.4 11.6 5.4 8.6 3.8 3.8 8.6 5.4 11.6 8.4 12.6 12.6z"/>
    <circle cx="15.6" cy="15.6" r="1.5"/>
  </g>
</svg>
